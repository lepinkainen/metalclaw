name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Install ripgrep (vault_search tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: task build-ci
