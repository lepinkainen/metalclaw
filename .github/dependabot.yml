version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
    reviewers: [lepinkainen]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    commit-message:
      prefix: deps
    labels: [dependencies, python]
    reviewers: [lepinkainen]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        patterns: ['*']
