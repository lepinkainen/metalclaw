version: '3'
tasks:
  lint:
    silent: true
    cmds:
      - uv run ruff check . --quiet --fix
      - uv run mypy . --no-error-summary
      - |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks dir . --config .gitleaks.toml --no-banner --log-level error
        else
          echo "gitleaks not installed; skipping secret scan"
        fi
      - echo "Lint OK"
  build:
    cmds:
      - task: lint
      - task: test
      - uv run python -c "import bot, tools, registry, self_change, memory, config"
  build-ci:
    desc: CI build — lint without autofix, tests, import check
    cmds:
      - uv run ruff check .
      - uv run mypy .
      - task: test-ci
      - uv run python -c "import bot, tools, registry, self_change, memory, config"
  test-ci:
    desc: Run tests (plain pytest output)
    cmd: uv run pytest -q
  test:
    silent: true
    cmds:
      - |
        out=$(mktemp)
        if uv run pytest -q >"$out" 2>&1; then
          rm -f "$out"
          echo "Tests OK"
        else
          cat "$out"
          rm -f "$out"
          exit 1
        fi
  daemon:
    desc: Run headless (Telegram + heartbeat only, no CLI REPL)
    cmd: uv run python bot.py --daemon
