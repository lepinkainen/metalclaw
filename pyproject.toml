[project]
name = "metalclaw"
version = "0.1.0"
description = "Single-user LLM chatbot with tool calling, exposed via CLI, Telegram and Discord frontends"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "discord.py>=2.3,<3.0",
    "httpx>=0.28.1",
    "litellm>=1.84",
    "markdown-it-py>=3.0",
    "markdownify>=0.13",
    "prompt_toolkit>=3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.14.2",
    "python-telegram-bot>=21.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tenacity>=9.2.1",  # litellm imports it for num_retries but no longer declares it
]

[dependency-groups]
dev = ["ruff", "pytest>=9.0.3"]
