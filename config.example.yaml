# Copy to one of (search order):
#   1. $METALCLAW_CONFIG (env override, absolute path)
#   2. ./config.yaml in the working directory (handy for dev — gitignored)
#   3. $XDG_CONFIG_HOME/metalclaw/config.yaml (or ~/.config/metalclaw/config.yaml)
# and fill in your values.

# Absolute path to your Obsidian vault. Memory files live under <vault_path>/<memory_subdir>/.
vault_path: /absolute/path/to/ObsidianVault

# Subdirectory inside the vault for Metalclaw memory files. Created if missing.
memory_subdir: Metalclaw/Memory

# Fastmail JMAP API token. Env FASTMAIL_API_TOKEN takes precedence if set.
fastmail_api_token: fmu1-xxxxxxxxxxxxxxxx

# Wilma (school information system) guardian login — enables the wilma tools.
# Unofficial API. Wilma allows one session per account, so the bot logging in
# may sign you out of Wilma in your browser (and vice versa).
# Env WILMA_URL / WILMA_USERNAME / WILMA_PASSWORD / WILMA_TOTP_SECRET take precedence.
# wilma_url: https://jarvenpaa.inschool.fi
# wilma_username: you@example.com
# wilma_password: xxxxxxxx
# Only if two-step verification is on: the authenticator *setup key* (base32), not a 6-digit code.
# wilma_totp_secret: JBSWY3DPEHPK3PXP

# Telegram bot token from @BotFather. Env TELEGRAM_BOT_TOKEN takes precedence if set.
telegram_bot_token: 123456:ABC-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# --- Discord ---
# Bot token from the Discord developer portal (https://discord.com/developers).
# Required scopes when inviting the bot: `bot`. Required intents (enabled in
# the dev portal): MESSAGE CONTENT INTENT (privileged), SERVER MEMBERS off,
# PRESENCE off. Env DISCORD_BOT_TOKEN takes precedence if set.
discord_bot_token: REPLACE_WITH_DISCORD_BOT_TOKEN
# Channel IDs that the bot treats as dedicated chat threads — it replies to
# every message in these channels (no @mention required), and each channel
# keeps its own conversation context. DMs always behave this way too. Other
# guild channels need an @mention or a reply to the bot's own message.
# Right-click a channel in Discord with developer mode on to copy its ID.
discord_chat_channels: []
# Channel ID where Discord heartbeats post. Required for any
# `heartbeat-discord*.md` file under the memory dir to deliver. Set to a
# server channel ID for shared visibility, or to a DM channel ID for private.
# discord_heartbeat_channel: 1000000000000000000

# Which LLM provider drives the bot. One of: ollama | litellm.
# Default: ollama (local). Use litellm to route through any cloud provider
# (Bedrock, OpenAI, Anthropic, Gemini, ...).
provider: ollama

# --- Ollama (local) ---
# Optional: override Ollama endpoint. Env OLLAMA_URL takes precedence.
ollama_url: http://localhost:11434/api/chat
# Ollama model name. Used only when provider == ollama.
model: gemma4:latest
# Sampling for Ollama. Small local models (Gemma 3n, Llama 3.1 8B, Qwen3 8B)
# default to temperature ~1.0 / top_p 0.95 / top_k 64 from the modelfile,
# which makes tool selection erratic — they pick the wrong tool or hallucinate
# arguments. The values below keep replies coherent without going fully
# deterministic. Comment out / set null to inherit the model's own default.
ollama_temperature: 0.2
ollama_top_p: 0.9
ollama_top_k: 40

# --- litellm (cloud, multi-provider) ---
# Used when provider == litellm or as the escalation target. Model strings
# follow litellm's prefix convention:
#   bedrock/anthropic.claude-haiku-4-5
#   bedrock/amazon.nova-pro-v1:0
#   bedrock/meta.llama3-70b-instruct-v1:0
#   openai/gpt-4o
#   anthropic/claude-haiku-4-5
#   gemini/gemini-1.5-pro
# AWS credentials use boto3's standard chain (env vars
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, ~/.aws/credentials, IAM role).
# OpenAI/Anthropic/Gemini use OPENAI_API_KEY / ANTHROPIC_API_KEY /
# GEMINI_API_KEY env vars (read directly by litellm).
litellm_model: bedrock/anthropic.claude-haiku-4-5
aws_region: us-east-1
# aws_profile: my-profile  # optional, otherwise default credential chain
# Anthropic prompt caching: mark the system prompt and the tool definitions
# as cacheable (cache_control: ephemeral) so Claude reuses them across calls
# instead of re-billing them as fresh input. Applied only when litellm_model /
# escalation_model targets a Claude model (anthropic/... or bedrock/...
# anthropic.* / *claude*); other providers get the plain request regardless.
litellm_prompt_caching: true

# --- Escalation: refer hard questions to a Big Boy cloud model ---
# When enabled and the active provider is local, the model can call the
# `escalate_to_big_model` tool, and the user can type `/big <query>` to
# bypass the local model entirely. escalation_model defaults to the
# escalation provider's own model (litellm_model for litellm) when unset;
# the Opus id below is an explicit override.
escalation_enabled: false
escalation_provider: litellm
escalation_model: bedrock/anthropic.claude-opus-4-7

# Heartbeat — proactive scheduled checks driven by tool calls. Actions are
# stored in <vault_path>/<memory_subdir>/heartbeat.yaml and managed by the
# model via create_heartbeat_action / list_heartbeat_actions /
# cancel_heartbeat_action.
heartbeat_enabled: true
heartbeat_interval_seconds: 1800
# Optional [start_hour, end_hour] (24h local time). Outside this window, ticks are skipped.
# heartbeat_active_hours: [8, 22]
# Channel that receives heartbeat notifications when an action does not pin
# its own. Format: "cli", "telegram-<chat_id>", "discord-<channel_id>". When
# unset and an action is created without an explicit channel, the action
# inherits the scope it was created from (CLI/Telegram chat/Discord channel).
# heartbeat_default_channel: cli
# After an action's run or delivery fails, retries back off exponentially
# (interval, 2x, 4x, ...) up to this cap. Clears on the next success.
# heartbeat_failure_backoff_max_seconds: 3600

# Allow `/add-tool` (live) and `/self-edit` (CLI) to spawn `claude -p` and
# mutate the bot's own source. Default true. Set to false on deployments
# where Telegram or Discord might be reachable by anyone other than you —
# `/add-tool` is reachable from those frontends and registers arbitrary new
# Python in `tools/<slug>.py`. CLI `/self-edit` is gated by the same flag.
allow_self_modification: true

# Show live tool-call status (emoji + tool name) in chat while the bot works.
# Per-chat override: /tools on|off in Telegram/Discord. Heartbeat runs stay quiet.
show_tool_calls: true

# Telegram/Discord: wait this many seconds of quiet after a message and join
# everything sent meanwhile (text + link, split pastes) into ONE turn. Slash
# commands are never delayed. 0 disables.
message_debounce_seconds: 1.0

# Runaway tool-loop guards. After max_tool_iterations tool-call rounds in one
# turn the model gets one final call with no tools so it must answer in text.
# If it issues the exact same tool call(s) max_repeated_tool_calls times in a
# row, the call is refused with an error result telling it to answer.
max_tool_iterations: 25
max_repeated_tool_calls: 3

# Glob patterns (relative to vault_path) excluded from /search and the
# search_vault tool. Defaults to empty — full vault is searched. ripgrep
# already skips hidden dirs (.obsidian, .trash) and respects .gitignore, so
# you typically only need this for big archive directories you don't want
# polluting results.
# vault_search_excludes:
#   - "Notion Export/**"
#   - "Journal/**"

# External MCP servers whose tools become model tools named <name>_<tool>.
# Header/env values support ${ENV_VAR} substitution at connect time (missing var =
# that server is marked down; the bot runs on). Results are wrapped as untrusted and clipped at 20000 chars. Keep the
# `include` allowlist tight: every schema costs prompt tokens on the local model.
# A server that fails to start is logged + shown in /status; the bot runs on.
# Restart the bot to reconnect a dead server.
#
# GitHub (hosted remote, read-only). Token: fine-grained PAT, read-only repo
# permissions Metadata, Contents, Issues, Actions, Pull requests. Read-only is
# enforced server-side by the /readonly path + X-MCP-Readonly, and X-MCP-Tools
# limits the server to exactly the tools in `include`.
# mcp_servers:
#   - name: github                       # ^[a-z][a-z0-9_]{0,15}$, unique
#     transport: http                    # http (streamable HTTP) | stdio
#     url: https://api.githubcopilot.com/mcp/readonly
#     headers:
#       Authorization: "Bearer ${GITHUB_MCP_TOKEN}"
#       X-MCP-Readonly: "true"
#       X-MCP-Tools: get_me,search_repositories,list_issues,issue_read,actions_list
#     include: [get_me, search_repositories, list_issues, issue_read, actions_list]
#     # exclude: [...]                   # denylist; mutually exclusive with include
#     hint: >-                           # optional; appended to the system prompt
#       For questions about the user's own GitHub projects (CI status, open
#       issues, issue summaries) use the github_* tools; call github_get_me
#       first to learn their login. For issue counts use github_list_issues (repo metadata counts include PRs).
#     # enabled: true
#     # startup_timeout_seconds: 10
#     # call_timeout_seconds: 60
#   - name: fs                           # stdio example: command runs as the bot user
#     transport: stdio
#     command: uvx
#     args: [some-mcp-server, --root, /data]
#     env: {SOME_TOKEN: "${SOME_TOKEN}"}  # child gets an allow-listed env + these
#     enabled: false
